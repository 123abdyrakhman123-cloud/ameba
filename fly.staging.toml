app = "ameba-web-staging-unconfigured"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.web"

[env]
  AMEBA_WEB_DB_PATH = "/data-web/web-staging.sqlite3"
  AMEBA_WEB_ENV = "staging"
  AMEBA_WEB_HOST = "0.0.0.0"
  AMEBA_WEB_PORT = "8080"
  AMEBA_WEB_BASE_URL = "https://ameba-web-staging-unconfigured.fly.dev"
  AMEBA_WEB_SESSION_TTL_SECONDS = "2592000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[mounts]]
  source = "ameba_web_staging_data"
  destination = "/data-web"
