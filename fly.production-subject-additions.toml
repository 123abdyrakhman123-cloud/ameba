app = "ameba-web-prod"
primary_region = "ams"

[build]
  dockerfile = "deploy/Dockerfile.subject-additions-overlay"

[env]
  AMEBA_WEB_DB_PATH = "/data-web/web-production.sqlite3"
  AMEBA_WEB_ENV = "production"
  AMEBA_WEB_DEMO_LOGIN = "0"
  AMEBA_WEB_TELEGRAM_LOGIN_ENABLED = "1"
  AMEBA_WEB_HOST = "0.0.0.0"
  AMEBA_WEB_PORT = "8080"
  AMEBA_WEB_BASE_URL = "https://ameba-app.uk"
  AMEBA_WEB_SESSION_TTL_SECONDS = "2592000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[mounts]]
  source = "ameba_web_prod_data"
  destination = "/data-web"
